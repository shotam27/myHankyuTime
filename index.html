<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>総持寺駅 時刻表</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #0f0;
            font-family: 'Arial', 'Helvetica', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            gap: 10px;
            padding: 20px;
        }

        .garbage-day {
            flex: 1;
            padding: 30px;
            border-radius: 10px;
            font-size: 60px;
            color: #fff;
            font-weight: bold;
            border: 3px solid #0f0;
            /* text-align: center; */
            /* display: flex; */
            align-items: center;
            /* justify-content: center; */
            height: calc(100vh - 40px);
            writing-mode: vertical-rl;
            text-orientation: upright;
        }

        .garbage-day.today {
            border-color: #ff0;
            animation: blink 1s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .atlanta-time {
            flex: 1;
            padding: 30px;
            border-radius: 10px;
            color: #fff;
            border: 3px solid #0af;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: calc(100vh - 40px);
            gap: 20px;
        }

        .atlanta-time .label {
            font-size: 40px;
        }

        .atlanta-time .time {
            font-size: 80px;
            font-weight: bold;
        }

        .station-info {
            flex: 1;
            padding: 30px;
            border-radius: 10px;
            color: #fff;
            border: 3px solid #f0f;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: calc(100vh - 40px);
            gap: 15px;
        }

        .station-info .station-name {
            font-size: 30px;
            font-weight: bold;
        }

        .station-info .day-type {
            font-size: 35px;
            color: #0af;
        }

        .station-info .current-time {
            font-size: 45px;
            color: #aaa;
        }

        .station-info .time-until {
            font-size: 45px;
            color: #ff0;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .station-info .next-train {
            color: #0f0;
            text-shadow: 0 0 20px #0f0;
            animation: pulse 2s ease-in-out infinite;
            font-size: 80px;
            font-weight: bold;
        }

        .last-update {
            position: fixed;
            bottom: 10px;
            right: 10px;
            font-size: 16px;
            color: #666;
        }

        .data-source {
            position: fixed;
            bottom: 10px;
            left: 10px;
            font-size: 16px;
            color: #666;
        }

        .music-button {
            margin-top: 20px;
            padding: 15px 30px;
            font-size: 20px;
            background: linear-gradient(45deg, #f00, #ff6b6b);
            color: #fff;
            border: 2px solid #ff0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        .music-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px #f00;
        }

        .music-button:active {
            transform: scale(0.95);
        }

        .music-button:disabled {
            background: #666;
            cursor: not-allowed;
            border-color: #444;
        }

        .music-info {
            margin-top: 10px;
            font-size: 18px;
            color: #ff6b6b;
        }
    </style>
</head>
<body>
    <div class="atlanta-time" id="atlantaTime">
        <div class="label">jp 日本</div>
        <div class="time" id="currentTime">--:--</div>
        <div class="label">🇺🇸 アトランタ</div>
        <div class="time" id="atlantaTimeValue">--:--</div>
    </div>
    <div class="station-info" id="stationInfo">
        <div class="station-name">阪急 梅田方面</div>
        <div class="day-type" id="dayType">--ダイヤ</div>
        <div class="next-train" id="display">
            <span>読み込み中...</span>
        </div>
        <div class="time-until" id="timeUntil"></div>
        <button class="music-button" id="musicButton" onclick="playLastMusic()">🎵 前回の曲を再生</button>
        <div class="music-info" id="musicInfo"></div>
    </div>
    <div class="garbage-day" id="garbageDay"></div>
    <div class="data-source">平日・休日自動判別</div>
    <div class="last-update" id="lastUpdate"></div>

    <script src="app.js"></script>
    <script>
        // YouTube Music再生機能
        let lastMusicData = null;

        // 最後に再生された曲の情報を取得
        async function fetchLastMusic() {
            try {
                const response = await fetch('http://192.168.11.21:8081/api/last_played');
                const data = await response.json();
                
                if (data.error) {
                    console.error('Error:', data.error);
                    document.getElementById('musicInfo').textContent = '再生履歴なし';
                    document.getElementById('musicButton').disabled = true;
                    return;
                }
                
                lastMusicData = data;
                document.getElementById('musicInfo').textContent = `${data.title} - ${data.artist}`;
                document.getElementById('musicButton').disabled = false;
            } catch (error) {
                console.error('Fetch error:', error);
                document.getElementById('musicInfo').textContent = 'データ取得エラー';
                document.getElementById('musicButton').disabled = true;
            }
        }

        // Nest Hubで曲を再生
        async function playLastMusic() {
            if (!lastMusicData || !lastMusicData.url) {
                alert('再生する曲が見つかりません');
                return;
            }

            document.getElementById('musicButton').textContent = '再生中...';
            document.getElementById('musicButton').disabled = true;

            try {
                const response = await fetch(`http://192.168.11.21:8081/api/cast_music?url=${encodeURIComponent(lastMusicData.url)}`);
                const data = await response.json();
                
                if (data.status === 'success') {
                    document.getElementById('musicButton').textContent = '🎵 前回の曲を再生';
                    setTimeout(() => {
                        document.getElementById('musicButton').disabled = false;
                    }, 3000);
                } else {
                    alert('再生エラー: ' + data.error);
                    document.getElementById('musicButton').textContent = '🎵 前回の曲を再生';
                    document.getElementById('musicButton').disabled = false;
                }
            } catch (error) {
                alert('通信エラー: ' + error.message);
                document.getElementById('musicButton').textContent = '🎵 前回の曲を再生';
                document.getElementById('musicButton').disabled = false;
            }
        }

        // ページ読み込み時に曲情報を取得
        fetchLastMusic();
        // 30秒ごとに更新
        setInterval(fetchLastMusic, 30000);
    </script>
</body>
</html>
